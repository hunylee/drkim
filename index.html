<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="김비서">
  <meta name="theme-color" content="#7c6fff">
  <meta name="description" content="마케팅팀의 일정, 업무, 매출을 한곳에서 관리하는 통합 비서 앱">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%237c6fff' width='192' height='192'/><text x='50%' y='50%' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>김</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%237c6fff' width='180' height='180' rx='40'/><text x='90' y='90' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>김</text></svg>">

  <title>김비서 - 마케팅팀 업무 관리</title>

  <style>
    /* ─── CSS Variables ─────────────────────────────────────────────── */
    :root {
      --transition: 0.35s cubic-bezier(.4,0,.2,1);
      --bg-base: #0f0f23;
      --bg-grad: linear-gradient(135deg, #0f0f23 0%, #1a1040 40%, #0d1f3c 100%);
      --card-bg: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.10);
      --text-primary: #e0e0e0;
      --text-secondary: #9090b0;
      --accent: #7c6fff;
      --accent-glow: rgba(124,111,255,0.35);
    }

    /* ─── Reset & Base ──────────────────────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;
      background: var(--bg-base);
      background-image: var(--bg-grad);
      color: var(--text-primary);
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .logo {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent) 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 12px;
    }

    .install-section {
      background: rgba(124, 111, 255, 0.1);
      border: 1px solid rgba(124, 111, 255, 0.3);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 32px;
      text-align: center;
      display: none;
    }

    .install-section.show {
      display: block;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .install-btn {
      background: linear-gradient(135deg, var(--accent) 0%, #a78bfa 100%);
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 4px 20px var(--accent-glow);
      margin: 0 8px;
    }

    .install-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--accent-glow);
    }

    .install-btn:active {
      transform: translateY(0);
    }

    /* ─── Menu Grid ──────────────────────────────────────────────── */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (min-width: 480px) {
      .menu-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .menu-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 28px 20px;
      text-decoration: none;
      color: inherit;
      transition: all var(--transition);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .menu-item:active {
      transform: scale(0.98);
    }

    .menu-item:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--accent);
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .menu-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .menu-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .menu-desc {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ─── Footer ──────────────────────────────────────────────── */
    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .status-badge {
      display: inline-block;
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .offline-notice {
      background: rgba(255, 80, 80, 0.1);
      border: 1px solid rgba(255, 80, 80, 0.3);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 12px;
      color: #ff8080;
      display: none;
    }

    .offline-notice.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">📊</div>
      <h1>김비서</h1>
      <p class="subtitle">마케팅팀 업무 관리 시스템</p>
      <div class="status-badge" id="statusBadge">PWA 활성</div>
    </div>

    <div class="offline-notice" id="offlineNotice">
      ⚠️ 오프라인 상태입니다. 이전에 로드된 콘텐츠를 표시합니다.
    </div>

    <div class="install-section" id="installSection">
      <p style="margin-bottom: 16px; font-size: 13px;">홈 화면에 추가하여<br>더 편하게 사용하세요!</p>
      <button class="install-btn" id="installBtn">앱에 추가</button>
      <button class="install-btn" style="background: transparent; border: 1px solid var(--accent); color: var(--accent); box-shadow: none;" id="dismissBtn">닫기</button>
    </div>

    <div class="menu-grid">
      <a href="보고서/dashboard.html" class="menu-item">
        <div class="menu-icon">📊</div>
        <div class="menu-title">대시보드</div>
        <div class="menu-desc">주간 일정 & 업무</div>
      </a>

      <a href="보고서/chart.html" class="menu-item">
        <div class="menu-icon">📈</div>
        <div class="menu-title">매출 현황</div>
        <div class="menu-desc">판매 데이터 분석</div>
      </a>

      <a href="보고서/meeting-result.html" class="menu-item">
        <div class="menu-icon">📋</div>
        <div class="menu-title">회의록</div>
        <div class="menu-desc">회의 내용 및 결정</div>
      </a>

      <a href="보고서/report.html" class="menu-item">
        <div class="menu-icon">📝</div>
        <div class="menu-title">분석 보고서</div>
        <div class="menu-desc">웹사이트 분석</div>
      </a>
    </div>

    <div class="footer">
      <p>🚀 PWA 앱으로 설치하면 오프라인에서도 이용 가능합니다</p>
      <p style="margin-top: 8px; font-size: 11px; color: var(--text-secondary);">마지막 업데이트: 2026-05-06</p>
    </div>
  </div>

  <script>
    // Service Worker 등록
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('[PWA] Service Worker 등록 완료:', registration);
          })
          .catch(error => {
            console.log('[PWA] Service Worker 등록 실패:', error);
          });
      });
    }

    // PWA 설치 프롬프트
    let deferredPrompt;
    const installSection = document.getElementById('installSection');
    const installBtn = document.getElementById('installBtn');
    const dismissBtn = document.getElementById('dismissBtn');
    const statusBadge = document.getElementById('statusBadge');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installSection.classList.add('show');
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`[PWA] 설치 결과: ${outcome}`);
        deferredPrompt = null;
        installSection.classList.remove('show');
      }
    });

    dismissBtn.addEventListener('click', () => {
      installSection.classList.remove('show');
    });

    // 앱이 이미 설치된 경우
    window.addEventListener('appinstalled', () => {
      console.log('[PWA] 앱이 설치되었습니다');
      statusBadge.textContent = '✓ 앱 설치됨';
      installSection.classList.remove('show');
    });

    // 온라인/오프라인 상태 감지
    const offlineNotice = document.getElementById('offlineNotice');

    window.addEventListener('online', () => {
      console.log('[PWA] 온라인 상태');
      offlineNotice.classList.remove('show');
      statusBadge.textContent = 'PWA 활성';
    });

    window.addEventListener('offline', () => {
      console.log('[PWA] 오프라인 상태');
      offlineNotice.classList.add('show');
      statusBadge.textContent = '⚠️ 오프라인';
    });

    // 초기 상태 확인
    if (!navigator.onLine) {
      offlineNotice.classList.add('show');
      statusBadge.textContent = '⚠️ 오프라인';
    }

    // 정기적인 Service Worker 업데이트 확인
    setInterval(() => {
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'CHECK_UPDATE' });
      }
    }, 60000); // 1분마다 확인
  </script>
</body>
</html>
